<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGATRADING Admin Login</title>


<style>

body{

background:#020617;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.box{

background:#071426;
padding:40px;
border-radius:20px;
border:1px solid #00bfff;
width:350px;
text-align:center;

}


h2{

color:#00bfff;

}


input{

width:100%;
padding:12px;
margin:10px 0;
background:#020617;
color:white;
border:1px solid #00bfff;
border-radius:10px;

}


button{

padding:12px 30px;
background:#00bfff;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;

}


button:hover{

background:white;

}


</style>


</head>


<body>


<div class="box">


<h2>
SAGATRADING
</h2>


<h3>
Admin Login
</h3>



<input
id="email"
type="email"
placeholder="Admin Email">



<input
id="password"
type="password"
placeholder="Password">



<button onclick="adminLogin()">

LOGIN

</button>



<p id="msg"></p>


</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

getAuth,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

getFirestore,

collection,

query,

where,

getDocs

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";




const firebaseConfig = {


apiKey: "AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain: "sagatrading-mentorship.firebaseapp.com",

projectId: "sagatrading-mentorship",

storageBucket: "sagatrading-mentorship.firebasestorage.app",

messagingSenderId: "832507974614",

appId: "1:832507974614:web:6ad7b3f941d348a7388a77"

};




const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);




window.adminLogin = async function(){


let email =
document.getElementById("email").value.trim();


let password =
document.getElementById("password").value.trim();


let msg =
document.getElementById("msg");



if(email==="" || password===""){

msg.innerHTML="Enter email and password";

return;

}



try{


msg.innerHTML="Checking...";



// Firebase login

await signInWithEmailAndPassword(

auth,

email,

password

);




// Check admins collection


const q=query(

collection(db,"admin"),

where("email","==",email)

);



const snap=await getDocs(q);



if(snap.empty){


msg.innerHTML=
"Access Denied ❌";


return;


}



let adminData=null;



snap.forEach((doc)=>{

adminData=doc.data();

});





if(adminData.role!=="admin"){


msg.innerHTML=
"Not an Admin Account";


return;


}





msg.innerHTML=
"Login Successful ✅";



setTimeout(()=>{


window.location.href="admin.html";


},1000);



}

catch(error){


console.log(error);


msg.innerHTML=
"Login Failed";


}



}


</script>
