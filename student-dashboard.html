<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGATRADING Student Dashboard</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
padding:20px;

background:#020617;
color:white;

}



.header{

display:flex;
justify-content:space-between;
align-items:center;

}



h1,h2{

color:#00bfff;

}



.card{

background:#071426;

border:1px solid #00bfff;

border-radius:20px;

padding:20px;

margin:20px 0;

}



.profile{

text-align:center;

}



#studentImage{

width:120px;

height:120px;

border-radius:50%;

border:3px solid #00bfff;

object-fit:cover;

}



button{

background:#00bfff;

color:black;

border:none;

padding:12px 25px;

border-radius:25px;

font-weight:bold;

cursor:pointer;

}



.lesson-card{

background:#0b1d35;

padding:15px;

margin:10px 0;

border-radius:15px;

}



.completed{

border:1px solid #00ff88;

}



.link{

color:#00ff88;

text-decoration:none;

}



textarea{

width:100%;

height:120px;

background:#020617;

color:white;

border:1px solid #00bfff;

border-radius:10px;

padding:10px;

}



.reply-box{

background:#102a43;

padding:15px;

border-radius:15px;

margin:10px 0;

}



.empty{

color:#aaa;

}



</style>


</head>



<body>


<div class="header">


<h1>
SAGATRADING Dashboard
</h1>


<button onclick="logoutUser()">

Logout

</button>


</div>





<div class="card profile">


<img id="studentImage"
src="">


<h2 id="studentName">
Loading...
</h2>


<p id="studentEmail"></p>


<p id="studentCourse"></p>


<p id="studentPhone"></p>


<p id="studentDate"></p>


</div>








<div class="card">


<h2>
Course Progress
</h2>


<h1 id="progressPercent">

0%

</h1>


<p id="progressText">

Loading...

</p>


</div>








<div class="card">


<h2>
Course Lessons
</h2>


<div id="videoList">

Loading Lessons...

</div>


</div>


<div class="card">

<h2>
🎥 Video Lessons
</h2>

<div id="videoList">

</div>

</div>



<div class="card">

<h2>
📄 PDF Materials
</h2>

<div id="pdfList">

</div>

</div>



<div class="card">

<h2>
📢 Announcements
</h2>

<div id="announcementList">

</div>

</div>





<div class="card">


<h2>
Admin Replies
</h2>


<div id="replyList">

Loading...

</div>


</div>








<div class="card">


<h2>
Send Feedback
</h2>


<textarea id="feedbackText"
placeholder="Write your feedback">

</textarea>


<br><br>


<button onclick="sendFeedback()">

Send Feedback

</button>


<p id="feedbackMessage"></p>


</div>









<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

getAuth,

onAuthStateChanged,

signOut

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

getFirestore,

collection,

query,

where,

getDocs,

doc,

getDoc,

setDoc,

addDoc,

serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";





const firebaseConfig = {


apiKey:"AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain:"sagatrading-mentorship.firebaseapp.com",

projectId:"sagatrading-mentorship",

storageBucket:"sagatrading-mentorship.firebasestorage.app",

messagingSenderId:"832507974614",

appId:"1:832507974614:web:6ad7b3f941d348a7388a77"

};





const app=initializeApp(firebaseConfig);


const auth=getAuth(app);


const db=getFirestore(app);



let currentEmail="";

let completedLessons=[];

let totalLessons=0;





function text(id,value){

let e=document.getElementById(id);

if(e){

e.innerHTML=value;

}

}



function image(id,value){

let e=document.getElementById(id);

if(e){

e.src=value;

}

}






console.log("DASHBOARD SCRIPT LOADED");







onAuthStateChanged(auth,async(user)=>{


if(!user){

window.location.href="student-login.html";

return;

}



currentEmail=user.email;


console.log("USER:",currentEmail);





const q=query(

collection(db,"students"),

where("email","==",currentEmail)

);



const snap=await getDocs(q);



console.log("STUDENT FOUND:",snap.size);





snap.forEach(item=>{


let data=item.data();


console.log(data);



text(

"studentName",

"Welcome "+data.name

);



text(

"studentEmail",

data.email

);



text(

"studentCourse",

data.course

);



text(

"studentPhone",

data.phone

);



text(

"studentDate",

data.date || "Not Available"

);



if(data.image){

image(
"studentImage",
data.image
);

}



});




await loadProgress();

await loadMaterials();

await loadReplies();


});









async function loadProgress(){


const ref=doc(

db,

"progress",

currentEmail

);



const snap=await getDoc(ref);



if(snap.exists()){


completedLessons=

snap.data().completedLessons || [];


}



updateProgress();


}







function updateProgress(){


let percent=0;


if(totalLessons>0){

percent=Math.round(

completedLessons.length/totalLessons*100

);

}



text(

"progressPercent",

percent+"%"

);



text(

"progressText",

"Completed Lessons: "+

completedLessons.length+

" / "+

totalLessons

);


}



async function loadMaterials(){


let video=document.getElementById("videoList");

let pdf=document.getElementById("pdfList");

let announce=document.getElementById("announcementList");



video.innerHTML="";

pdf.innerHTML="";

announce.innerHTML="";



const snap=await getDocs(

collection(db,"materials")

);



snap.forEach((item)=>{


let data=item.data();



if(data.type==="video"){


video.innerHTML+=`

<div class="lesson-card">

<h3>${data.title}</h3>

<a class="link"
href="${data.link}"
target="_blank">

▶ Watch Online

</a>

</div>

`;

}



if(data.type==="pdf"){


pdf.innerHTML+=`

<div class="lesson-card">

<h3>${data.title}</h3>

<a class="link"
href="${data.link}"
target="_blank">

📄 View PDF

</a>

</div>

`;

}



if(data.type==="announcement"){


announce.innerHTML+=`

<div class="lesson-card">

<h3>${data.title}</h3>

<p>${data.description || ""}</p>

</div>

`;

}


});


}







let box=document.getElementById("videoList");


box.innerHTML="";


const snap=await getDocs(

collection(db,"materials")

);



totalLessons=0;



snap.forEach(item=>{


let data=item.data();



if(data.type==="video"){


totalLessons++;


let done=

completedLessons.includes(data.title);



box.innerHTML+=`


<div class="lesson-card ${done?"completed":""}">


<h3>${data.lesson || "Lesson"}</h3>


<p>${data.title || ""}</p>


<a class="link"

href="${data.link}"

target="_blank">

▶ Watch Lesson

</a>


<br><br>


<button onclick="completeLesson('${data.title}')">

${done?"Completed":"Complete Lesson"}

</button>


</div>


`;



}


});



updateProgress();


}







window.completeLesson=async function(title){


if(!completedLessons.includes(title)){

completedLessons.push(title);

}



await setDoc(

doc(db,"progress",currentEmail),

{

studentEmail:currentEmail,

completedLessons

}

);



loadLessons();


}








async function loadReplies(){


let box=document.getElementById("replyList");


box.innerHTML="";


const q=query(

collection(db,"feedback"),

where("studentEmail","==",currentEmail)

);



const snap=await getDocs(q);



if(snap.empty){

box.innerHTML="No Replies Yet";

return;

}



snap.forEach(item=>{


let data=item.data();



if(data.reply){


box.innerHTML+=`

<div class="reply-box">

<b>Admin Reply</b>

<br><br>

${data.reply}

</div>

`;

}


});


}








window.sendFeedback=async function(){


let box=document.getElementById("feedbackText");


let msg=document.getElementById("feedbackMessage");



if(box.value.trim()==""){

msg.innerHTML="Write feedback first";

return;

}



await addDoc(

collection(db,"feedback"),

{

studentEmail:currentEmail,

message:box.value,

reply:"",

time:serverTimestamp()

}

);



msg.innerHTML="Feedback Sent ✅";


box.value="";


}








window.logoutUser=function(){


signOut(auth)

.then(()=>{

window.location.href="student-login.html";

});


}



</script>


</body>

</html>
