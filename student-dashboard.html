<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

getAuth,

onAuthStateChanged,

signOut

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

getFirestore,

collection,

query,

where,

getDocs,

doc,

getDoc,

setDoc,

addDoc,

serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";




const firebaseConfig = {


apiKey:"AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain:"sagatrading-mentorship.firebaseapp.com",

projectId:"sagatrading-mentorship",

storageBucket:"sagatrading-mentorship.firebasestorage.app",

messagingSenderId:"832507974614",

appId:"1:832507974614:web:6ad7b3f941d348a7388a77",

measurementId:"G-BW06QF70MP"

};



const app = initializeApp(firebaseConfig);


const auth=getAuth(app);


const db=getFirestore(app);



let currentEmail="";

let completedLessons=[];

let totalLessons=0;



onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="student-login.html";

return;

}



currentEmail=user.email;



console.log("USER:",currentEmail);



const q=query(

collection(db,"students"),

where("email","==",currentEmail)

);



const snap=await getDocs(q);



snap.forEach((item)=>{


let data=item.data();



document.getElementById("studentName").innerHTML=

"Welcome "+(data.name || "Student");



document.getElementById("studentEmail").innerHTML=

data.email || currentEmail;



document.getElementById("studentCourse").innerHTML=

data.course || "No Course";



document.getElementById("studentPhone").innerHTML=

data.phone || "Not Added";



document.getElementById("studentDate").innerHTML=

data.date || "Not Available";



if(data.image){

document.getElementById("studentImage").src=data.image;

}


});



await loadProgress();

loadLessons();

loadReplies();



});
async function loadProgress(){


const progressRef = doc(

db,

"progress",

currentEmail

);



const snap = await getDoc(progressRef);



if(snap.exists()){


completedLessons =

snap.data().completedLessons || [];


}



updateProgress();


}





function updateProgress(){


let percent = 0;



if(totalLessons > 0){


percent = Math.round(

(completedLessons.length / totalLessons) * 100

);


}




document.getElementById("progressPercent").innerHTML =

percent+"%";



document.getElementById("progressText").innerHTML =

"Completed Lessons: "

+completedLessons.length+

" / "

+totalLessons;



}







async function loadLessons(){



const snapshot = await getDocs(

collection(db,"materials")

);



const box = document.getElementById("videoList");



box.innerHTML="";



totalLessons=0;





snapshot.forEach((item)=>{


let data=item.data();



if(data.type==="video"){



totalLessons++;



let completed =

completedLessons.includes(data.title);





box.innerHTML += `


<div class="lesson-card ${completed ? "completed":""}">


<div class="lesson-title">

${data.lesson || "Lesson"}

<br>

${data.title}

</div>



<br>


<a class="link"

href="${data.link}"

target="_blank">

▶ Watch Lesson

</a>



<br><br>



<button class="lesson-btn"

onclick="completeLesson('${data.title}')"

${completed ? "disabled":""}>


${completed ? "✅ Completed":"Complete Lesson"}


</button>



</div>


`;



}



});




if(totalLessons===0){


box.innerHTML=

"<p class='empty'>No Lessons Available</p>";


}



updateProgress();


}








window.completeLesson = async function(title){



if(!completedLessons.includes(title)){


completedLessons.push(title);


}




await setDoc(

doc(db,"progress",currentEmail),

{


studentEmail:currentEmail,

completedLessons:completedLessons


}

);



alert("Lesson Completed ✅");



loadLessons();



}








async function loadReplies(){



const box=document.getElementById("replyList");



box.innerHTML="";





const q=query(

collection(db,"feedback"),

where("studentEmail","==",currentEmail)

);





const snap=await getDocs(q);





if(snap.empty){


box.innerHTML=

"<p class='empty'>No Replies Yet...</p>";


return;


}





snap.forEach((item)=>{


let data=item.data();



if(data.reply){



box.innerHTML += `


<div class="reply-box">


<b>Admin Reply:</b>


<br><br>


${data.reply}


</div>


`;



}



});



}









window.sendFeedback = async function(){



let text = document

.getElementById("feedbackText")

.value

.trim();



let msg=document.getElementById("feedbackMessage");





if(text===""){


msg.innerHTML="Write your feedback first";


return;


}





await addDoc(

collection(db,"feedback"),

{


studentEmail:currentEmail,

message:text,

reply:"",

time:serverTimestamp()


}

);





msg.innerHTML="Feedback Sent Successfully ✅";



document.getElementById("feedbackText").value="";



}








window.logoutUser=function(){



signOut(auth)

.then(()=>{


window.location.href="student-login.html";


});


}



</script>


</body>

</html>
