<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc,
setDoc,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain:"sagatrading-mentorship.firebaseapp.com",

projectId:"sagatrading-mentorship",

storageBucket:"sagatrading-mentorship.firebasestorage.app",

messagingSenderId:"832507974614",

appId:"1:832507974614:web:6ad7b3f941d348a7388a77",

measurementId:"G-BW06QF70MP"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



let currentEmail = "";

let completedLessons = [];

let totalLessons = 0;



function text(id,value){

let e=document.getElementById(id);

if(e){

e.innerHTML=value;

}

}



function image(id,value){

let e=document.getElementById(id);

if(e){

e.src=value;

}

}



console.log("DASHBOARD SCRIPT LOADED");





onAuthStateChanged(auth, async(user)=>{


try{


if(!user){

window.location.href="student-login.html";

return;

}



currentEmail=user.email;


console.log("USER:",currentEmail);





const q=query(

collection(db,"students"),

where("email","==",currentEmail)

);



const snap=await getDocs(q);



console.log("STUDENT FOUND:",snap.size);



snap.forEach((item)=>{

console.log("STUDENT DATA:",item.data());


let data=item.data();



text(
"studentName",
"Welcome "+(data.name || "Student")
);



text(
"studentEmail",
data.email || currentEmail
);



text(
"studentCourse",
data.course || "No Course"
);



text(
"studentPhone",
data.phone || "Not Added"
);



text(
"studentDate",
data.date || "Not Available"
);



if(data.image){

image(
"studentImage",
data.image
);

}


});





if(snap.empty){


text(
"studentName",
"Student profile not found"
);


return;


}





await loadProgress();

await loadLessons();

await loadReplies();



}



catch(error){


console.log("DASHBOARD ERROR:",error);


text(
"studentName",
"Loading Error"
);


}



});









async function loadProgress(){


const ref=doc(

db,

"progress",

currentEmail

);



const snap=await getDoc(ref);



if(snap.exists()){


completedLessons=snap.data().completedLessons || [];


}



updateProgress();



}









function updateProgress(){


let percent=0;


if(totalLessons>0){


percent=Math.round(

(completedLessons.length/totalLessons)*100

);


}



text(
"progressPercent",
percent+"%"
);



text(
"progressText",

"Completed Lessons: "

+completedLessons.length+

" / "

+totalLessons

);



}









async function loadLessons(){



let box=document.getElementById("videoList");


if(!box)return;



box.innerHTML="";



const snap=await getDocs(

collection(db,"materials")

);



totalLessons=0;



snap.forEach((item)=>{


let data=item.data();



if(data.type==="video"){



totalLessons++;


let done=

completedLessons.includes(data.title);



box.innerHTML+=`


<div class="lesson-card ${done?"completed":""}">


<div class="lesson-title">

${data.lesson || "Lesson"}

<br>

${data.title || ""}

</div>



<br>


<a class="link"

href="${data.link || "#"}"

target="_blank">

▶ Watch Lesson

</a>



<br><br>



<button class="lesson-btn"

onclick="completeLesson('${data.title}')">


${done?"✅ Completed":"Complete Lesson"}


</button>


</div>


`;



}



});




if(totalLessons===0){


box.innerHTML=

"<p class='empty'>No Lessons Available</p>";


}



updateProgress();



}









window.completeLesson=async function(title){



if(!completedLessons.includes(title)){


completedLessons.push(title);


}



await setDoc(

doc(db,"progress",currentEmail),

{

studentEmail:currentEmail,

completedLessons:completedLessons

}

);



alert("Lesson Completed ✅");


loadLessons();



}









async function loadReplies(){



let box=document.getElementById("replyList");


if(!box)return;



box.innerHTML="";



const q=query(

collection(db,"feedback"),

where("studentEmail","==",currentEmail)

);



const snap=await getDocs(q);



if(snap.empty){


box.innerHTML=

"<p class='empty'>No Replies Yet...</p>";


return;


}



snap.forEach((item)=>{


let data=item.data();



if(data.reply){


box.innerHTML+=`


<div class="reply-box">


<b>Admin Reply:</b>


<br><br>


${data.reply}


</div>


`;


}


});


}









window.sendFeedback=async function(){



let box=document.getElementById("feedbackText");

let msg=document.getElementById("feedbackMessage");



let textValue=box.value.trim();



if(textValue===""){


msg.innerHTML="Write your feedback first";


return;


}



await addDoc(

collection(db,"feedback"),

{

studentEmail:currentEmail,

message:textValue,

reply:"",

time:serverTimestamp()

}

);



msg.innerHTML="Feedback Sent Successfully ✅";


box.value="";



}









window.logoutUser=function(){


signOut(auth)

.then(()=>{


window.location.href="student-login.html";


});


}



</script>
