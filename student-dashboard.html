<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGATRADING Student Dashboard</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
padding:20px;

background:#020617;

color:white;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}



.header h1{

color:#00bfff;

}



button{

background:#00bfff;

color:black;

border:none;

padding:12px 25px;

border-radius:25px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:white;

}



.card{

background:#071426;

border:1px solid #00bfff;

border-radius:20px;

padding:20px;

margin-bottom:20px;

}



.card h2{

color:#00bfff;

}



.profile{

text-align:center;

}



#studentImage{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

border:3px solid #00bfff;

}



.student-line{

margin:10px;

}



.progress-bar{

height:20px;

width:100%;

background:#020617;

border-radius:20px;

border:1px solid #00bfff;

overflow:hidden;

}



#progressFill{

height:100%;

width:0%;

background:#00bfff;

}



.material-card{

background:#0b1d35;

padding:15px;

margin:12px 0;

border-radius:15px;

}



.material-title{

font-size:18px;

font-weight:bold;

}



.link{

display:inline-block;

margin-top:12px;

padding:8px 18px;

background:#00bfff;

color:black !important;

border-radius:20px;

text-decoration:none;

font-weight:bold;

}



.link:hover{

background:white;

}



.reply-box{

background:#102a43;

padding:15px;

border-radius:15px;

margin:10px 0;

}



textarea{

width:100%;

height:120px;

background:#020617;

color:white;

border:1px solid #00bfff;

border-radius:10px;

padding:12px;

}



.empty{

color:#aaa;

}



@media(max-width:700px){

body{

padding:10px;

}


.header{

flex-direction:column;

gap:15px;

}

}



</style>

</head>


<body>



<div class="header">

<h1>
SAGATRADING Dashboard
</h1>


<button id="logoutBtn">
Logout
</button>


</div>





<div class="card profile">


<img id="studentImage"

src="https://ui-avatars.com/api/?name=Student"

>



<h2 id="studentName">

Loading...

</h2>



<p>
📧 <span id="studentEmail"></span>
</p>


<p>
📚 <span id="studentCourse"></span>
</p>


<p>
📞 <span id="studentPhone"></span>
</p>


<p>
📅 <span id="studentDate"></span>
</p>



</div>





<div class="card">


<h2>
Course Progress
</h2>


<h1 id="progressPercent">
0%
</h1>



<div class="progress-bar">

<div id="progressFill"></div>

</div>



<p id="progressText">
Loading...
</p>


</div>





<div class="card">

<h2>
🎥 Video Lessons
</h2>


<div id="videoList">

<p class="empty">
Loading videos...
</p>


</div>


</div>





<div class="card">


<h2>
📄 PDF Materials
</h2>


<div id="pdfList">

<p class="empty">
Loading PDFs...
</p>


</div>


</div>





<div class="card">


<h2>
📢 Announcements
</h2>


<div id="announcementList">

<p class="empty">
Loading announcements...
</p>


</div>


</div>





<div class="card">


<h2>
Admin Replies
</h2>


<div id="replyList">

<p class="empty">
Loading replies...
</p>


</div>


</div>





<div class="card">


<h2>
Send Feedback
</h2>


<textarea id="feedbackText"

placeholder="Write your feedback">

</textarea>


<br><br>


<button id="feedbackBtn">

Send Feedback

</button>


<p id="feedbackMessage"></p>


</div>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



import {

getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc,
setDoc,
addDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";




const firebaseConfig = {

apiKey:"AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain:"sagatrading-mentorship.firebaseapp.com",

projectId:"sagatrading-mentorship",

storageBucket:"sagatrading-mentorship.firebasestorage.app",

messagingSenderId:"832507974614",

appId:"1:832507974614:web:6ad7b3f941d348a7388a77",

measurementId:"G-BW06QF70MP"

};




const app = initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);



let currentEmail="";

let completedLessons=[];

let totalLessons=0;



function text(id,value){

let e=document.getElementById(id);

if(e){

e.textContent=value;

}

}




onAuthStateChanged(auth,async(user)=>{


if(!user){

window.location.href="student-login.html";

return;

}


currentEmail=user.email;


console.log("USER:",currentEmail);



const q=query(

collection(db,"students"),

where("email","==",currentEmail)

);



const snap=await getDocs(q);



console.log("STUDENT FOUND:",snap.size);



if(snap.empty){

text("studentName","Student Not Found");

return;

}



let data;


snap.forEach((item)=>{

data=item.data();

});



text(
"studentName",
"Welcome "+(data.name || "Student")
);


text(
"studentEmail",
data.email || currentEmail
);


text(
"studentCourse",
data.course || "No Course"
);


text(
"studentPhone",
data.phone || "Not Added"
);


text(
"studentDate",
data.date || "Not Available"
);



if(data.image){

document.getElementById("studentImage").src=data.image;

}



await loadProgress();

await loadMaterials();

await loadReplies();


});







async function loadProgress(){


const ref=doc(

db,

"progress",

currentEmail

);


const snap=await getDoc(ref);



if(snap.exists()){


completedLessons=

snap.data().completedLessons || [];


}



updateProgress();


}







function updateProgress(){


let percent=0;


if(totalLessons>0){

percent=Math.round(

(completedLessons.length/totalLessons)*100

);

}



text(
"progressPercent",
percent+"%"
);


text(
"progressText",

"Completed Lessons: "

+completedLessons.length+

" / "

+totalLessons

);



document.getElementById("progressFill")
.style.width=percent+"%";


}









async function loadMaterials(){



let video=document.getElementById("videoList");

let pdf=document.getElementById("pdfList");

let announcement=document.getElementById("announcementList");



video.innerHTML="";

pdf.innerHTML="";

announcement.innerHTML="";



totalLessons=0;



const snap=await getDocs(

collection(db,"materials")

);



snap.forEach((item)=>{


let data=item.data();


let type=(data.type || "")
.toLowerCase();



if(type==="video"){


totalLessons++;


video.innerHTML+=`

<div class="material-card">


<div class="material-title">

${data.title || "Video Lesson"}

</div>


<a class="link"

href="${data.link || '#'}"

target="_blank">

▶ Watch Video

</a>


<br><br>


<button onclick="completeLesson('${data.title}')">

${
completedLessons.includes(data.title)
?
"✅ Completed"
:
"Complete Lesson"
}

</button>


</div>

`;

}




if(type==="pdf"){


pdf.innerHTML+=`

<div class="material-card">


<div class="material-title">

${data.title || "PDF"}

</div>


<a class="link"

href="${data.link || '#'}"

target="_blank">

📄 View PDF

</a>


</div>

`;

}




if(type==="announcement"){


announcement.innerHTML+=`

<div class="material-card">


<div class="material-title">

${data.title || "Announcement"}

</div>


<p>

${data.description || data.message || ""}

</p>


</div>

`;

}



});



if(video.innerHTML===""){

video.innerHTML="<p class='empty'>No Videos</p>";

}


if(pdf.innerHTML===""){

pdf.innerHTML="<p class='empty'>No PDFs</p>";

}


if(announcement.innerHTML===""){

announcement.innerHTML="<p class='empty'>No Announcements</p>";

}



updateProgress();


}








window.completeLesson=async function(title){


if(!completedLessons.includes(title)){

completedLessons.push(title);

}



await setDoc(

doc(db,"progress",currentEmail),

{

studentEmail:currentEmail,

completedLessons:completedLessons

},

{merge:true}

);



alert("Lesson Completed ✅");


loadMaterials();


}









async function loadReplies(){



let box=document.getElementById("replyList");


box.innerHTML="";


const q=query(

collection(db,"feedback"),

where("studentEmail","==",currentEmail)

);



const snap=await getDocs(q);



let found=false;



snap.forEach((item)=>{


let data=item.data();


if(data.reply){


found=true;


box.innerHTML+=`

<div class="reply-box">

<b>Admin Reply:</b>

<br><br>

${data.reply}

</div>

`;

}


});



if(!found){

box.innerHTML=

"<p class='empty'>No Replies Yet</p>";

}



}









document

.getElementById("feedbackBtn")

.onclick=async()=>{


let box=document.getElementById("feedbackText");


let msg=document.getElementById("feedbackMessage");


let value=box.value.trim();



if(value===""){

msg.textContent="Write feedback first";

return;

}



await addDoc(

collection(db,"feedback"),

{

studentEmail:currentEmail,

message:value,

reply:"",

time:serverTimestamp()

}

);



msg.textContent="Feedback Sent Successfully ✅";


box.value="";


};








document

.getElementById("logoutBtn")

.onclick=async()=>{


await signOut(auth);


window.location.href="student-login.html";


};



</script>


</body>

</html>
