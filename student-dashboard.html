<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGATRADING Student Dashboard</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
padding:20px;
background:#020617;
color:white;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-bottom:20px;
}

.header h1{
margin:0;
color:#00bfff;
}

button{
background:#00bfff;
color:black;
border:none;
padding:11px 24px;
border-radius:25px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.card{
background:#071426;
border:1px solid #00bfff;
border-radius:20px;
padding:20px;
margin:18px 0;
}

.card h2{
margin-top:0;
color:#00bfff;
}

.profile{
text-align:center;
}

#studentImage{
width:110px;
height:110px;
border-radius:50%;
border:3px solid #00bfff;
object-fit:cover;
background:#0b1d35;
}

.student-line{
margin:10px 0;
}

.progress-bar{
width:100%;
height:18px;
background:#020617;
border:1px solid #00bfff;
border-radius:20px;
overflow:hidden;
margin:15px 0;
}

#progressFill{
height:100%;
width:0%;
background:#00bfff;
transition:width .3s ease;
}

.material-card{
background:#0b1d35;
padding:16px;
margin:12px 0;
border-radius:15px;
}

.material-card.completed{
border:1px solid #00ff88;
}

.material-title{
font-size:18px;
font-weight:bold;
}

.link{
display:inline-block;
margin-top:10px;
color:#00ff88;
text-decoration:none;
}

.link:hover{
text-decoration:underline;
}

textarea{
width:100%;
height:120px;
resize:vertical;
background:#020617;
color:white;
border:1px solid #00bfff;
border-radius:10px;
padding:12px;
}

.reply-box{
background:#102a43;
padding:15px;
border-radius:15px;
margin:10px 0;
}

.empty{
color:#aaa;
}

#feedbackMessage{
color:#00ff88;
margin-top:12px;
}

@media(max-width:700px){

body{
padding:12px;
}

.header{
align-items:flex-start;
flex-direction:column;
}

.header h1{
font-size:26px;
}

.card{
padding:16px;
}

button{
width:auto;
}

}

</style>
</head>

<body>

<div class="header">
<h1>SAGATRADING Dashboard</h1>
<button id="logoutBtn">Logout</button>
</div>

<div class="card profile">

<img id="studentImage"
src="https://ui-avatars.com/api/?name=Student&background=071426&color=00bfff&size=200"
alt="Student">

<h2 id="studentName">Loading...</h2>

<p class="student-line">
📧 <span id="studentEmail"></span>
</p>

<p class="student-line">
📚 <span id="studentCourse"></span>
</p>

<p class="student-line">
📞 <span id="studentPhone"></span>
</p>

<p class="student-line">
📅 <span id="studentDate"></span>
</p>

</div>

<div class="card">

<h2>Course Progress</h2>

<h1 id="progressPercent">0%</h1>

<div class="progress-bar">
<div id="progressFill"></div>
</div>

<p id="progressText">Loading...</p>

</div>

<div class="card">

<h2>🎥 Video Lessons</h2>

<div id="videoList">
<p class="empty">Loading videos...</p>
</div>

</div>

<div class="card">

<h2>📄 PDF Materials</h2>

<div id="pdfList">
<p class="empty">Loading PDFs...</p>
</div>

</div>

<div class="card">

<h2>📢 Announcements</h2>

<div id="announcementList">
<p class="empty">Loading announcements...</p>
</div>

</div>

<div class="card">

<h2>Admin Replies</h2>

<div id="replyList">
<p class="empty">Loading replies...</p>
</div>

</div>

<div class="card">

<h2>Send Feedback</h2>

<textarea
id="feedbackText"
placeholder="Write your feedback here...">
</textarea>

<br><br>

<button id="feedbackBtn">
Send Feedback
</button>

<p id="feedbackMessage"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc,
setDoc,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain:"sagatrading-mentorship.firebaseapp.com",

projectId:"sagatrading-mentorship",

storageBucket:"sagatrading-mentorship.firebasestorage.app",

messagingSenderId:"832507974614",

appId:"1:832507974614:web:6ad7b3f941d348a7388a77",

measurementId:"G-BW06QF70MP"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let currentEmail = "";

let completedLessons = [];

let totalLessons = 0;


function setText(id,value){

const el=document.getElementById(id);

if(el){
el.textContent=value;
}

}


function setImage(id,value){

const el=document.getElementById(id);

if(el && value){
el.src=value;
}

}


console.log("DASHBOARD SCRIPT LOADED");


onAuthStateChanged(auth, async(user)=>{

try{

if(!user){

window.location.href="student-login.html";

return;

}


currentEmail=user.email || "";

console.log("USER:",currentEmail);


const studentQuery=query(

collection(db,"students"),

where("email","==",currentEmail)

);


const studentSnap=await getDocs(studentQuery);


console.log("STUDENT FOUND:",studentSnap.size);


if(studentSnap.empty){

setText("studentName","Student profile not found");
setText("studentEmail",currentEmail);

return;

}


let studentData=null;


studentSnap.forEach((item)=>{

studentData=item.data();

});


console.log("STUDENT DATA:",studentData);


setText(
"studentName",
"Welcome "+(studentData.name || "Student")
);


setText(
"studentEmail",
studentData.email || currentEmail
);


setText(
"studentCourse",
studentData.course || "No Course"
);


setText(
"studentPhone",
studentData.phone || "Not Added"
);


setText(
"studentDate",
studentData.date || "Not Available"
);


if(studentData.image){

setImage(
"studentImage",
studentData.image
);

}


await loadProgress();

await loadMaterials();

await loadReplies();

await loadVideos();

await loadPDFs();

await loadAnnouncements();

  

}

catch(error){

console.error("DASHBOARD ERROR:",error);

setText(
"studentName",
"Loading Error"
);

}

});


async function loadProgress(){

try{

const progressRef=doc(

db,

"progress",

currentEmail

);


const progressSnap=await getDoc(progressRef);


if(progressSnap.exists()){

completedLessons=
progressSnap.data().completedLessons || [];

}
else{

completedLessons=[];

}


updateProgress();

}

catch(error){

console.error("PROGRESS ERROR:",error);

completedLessons=[];

updateProgress();

}

}


function updateProgress(){

let percent=0;


if(totalLessons>0){

percent=Math.round(

(completedLessons.length / totalLessons) * 100

);

}


if(percent>100){
percent=100;
}


setText(
"progressPercent",
percent+"%"
);


setText(
"progressText",
"Completed Lessons: "+
completedLessons.length+
" / "+
totalLessons
);


const fill=document.getElementById("progressFill");

if(fill){

fill.style.width=percent+"%";

}

}


async function loadMaterials(){

const videoBox=
document.getElementById("videoList");

const pdfBox=
document.getElementById("pdfList");

const announcementBox=
document.getElementById("announcementList");


videoBox.innerHTML="";
pdfBox.innerHTML="";
announcementBox.innerHTML="";


try{

const snap=await getDocs(

collection(db,"materials")

);


totalLessons=0;

let videoCount=0;
let pdfCount=0;
let announcementCount=0;


snap.forEach((item)=>{

const data=item.data();

const type=(data.type || "")
.toLowerCase()
.trim();


if(type==="video"){

videoCount++;
totalLessons++;


const title=
data.title || "Video Lesson";


const done=
completedLessons.includes(title);


const card=document.createElement("div");

card.className=
"material-card"+
(done ? " completed" : "");


const titleEl=
document.createElement("div");

titleEl.className="material-title";

titleEl.textContent=
data.lesson
? data.lesson+" - "+title
: title;


card.appendChild(titleEl);


if(data.link){

const link=
document.createElement("a");

link.className="link";
link.href=data.link;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="▶ Watch Online";

card.appendChild(link);

}


const break1=
document.createElement("br");

const break2=
document.createElement("br");

card.appendChild(break1);
card.appendChild(break2);


const btn=
document.createElement("button");

btn.textContent=
done
? "✅ Completed"
: "Complete Lesson";


btn.addEventListener(
"click",
()=>completeLesson(title)
);


card.appendChild(btn);


videoBox.appendChild(card);

}


else if(type==="pdf"){

pdfCount++;


const card=
document.createElement("div");

card.className="material-card";


const titleEl=
document.createElement("div");

titleEl.className="material-title";

titleEl.textContent=
data.title || "PDF Material";


card.appendChild(titleEl);


if(data.link){

const link=
document.createElement("a");

link.className="link";

link.href=data.link;

link.target="_blank";

link.rel="noopener noreferrer";

link.textContent="📄 View PDF Online";

card.appendChild(link);

}
else{

const p=
document.createElement("p");

p.className="empty";

p.textContent=
"PDF link not available";

card.appendChild(p);

}


pdfBox.appendChild(card);

}


else if(type==="announcement"){

announcementCount++;


const card=
document.createElement("div");

card.className="material-card";


const titleEl=
document.createElement("div");

titleEl.className="material-title";

titleEl.textContent=
data.title || "Announcement";


card.appendChild(titleEl);


const message=
data.description ||
data.message ||
data.content ||
"";


if(message){

const p=
document.createElement("p");

p.textContent=message;

card.appendChild(p);

}


if(data.link){

const link=
document.createElement("a");

link.className="link";

link.href=data.link;

link.target="_blank";

link.rel="noopener noreferrer";

link.textContent="Open Link";

card.appendChild(link);

}


announcementBox.appendChild(card);

}

});


if(videoCount===0){

videoBox.innerHTML=
"<p class='empty'>No Video Lessons Available</p>";

}


if(pdfCount===0){

pdfBox.innerHTML=
"<p class='empty'>No PDF Materials Available</p>";

}


if(announcementCount===0){

announcementBox.innerHTML=
"<p class='empty'>No Announcements Yet</p>";

}


updateProgress();

}

catch(error){

console.error("MATERIAL ERROR:",error);


videoBox.innerHTML=
"<p class='empty'>Unable to load videos</p>";


pdfBox.innerHTML=
"<p class='empty'>Unable to load PDFs</p>";


announcementBox.innerHTML=
"<p class='empty'>Unable to load announcements</p>";

}

}


async function completeLesson(title){

try{

if(!completedLessons.includes(title)){

completedLessons.push(title);

}


await setDoc(

doc(db,"progress",currentEmail),

{

studentEmail:currentEmail,

completedLessons:completedLessons

},

{merge:true}

);


await loadMaterials();

}

catch(error){

console.error(
"COMPLETE LESSON ERROR:",
error
);

alert(
"Could not save lesson progress."
);

}

}


async function loadReplies(){

const box=
document.getElementById("replyList");


box.innerHTML="";


try{

const feedbackQuery=query(

collection(db,"feedback"),

where(
"studentEmail",
"==",
currentEmail
)

);


const snap=
await getDocs(feedbackQuery);


let replyCount=0;


snap.forEach((item)=>{

const data=item.data();


if(
data.reply &&
data.reply.trim()!==""
){

replyCount++;


const reply=
document.createElement("div");

reply.className="reply-box";


const heading=
document.createElement("b");

heading.textContent=
"Admin Reply:";


const message=
document.createElement("p");

message.textContent=
data.reply;


reply.appendChild(heading);

reply.appendChild(message);

box.appendChild(reply);

}

});


if(replyCount===0){

box.innerHTML=
"<p class='empty'>No Replies Yet...</p>";

}

}

catch(error){

console.error(
"REPLIES ERROR:",
error
);


box.innerHTML=
"<p class='empty'>Unable to load replies</p>";

}

}


async function sendFeedback(){

const box=
document.getElementById("feedbackText");

const msg=
document.getElementById("feedbackMessage");


const value=
box.value.trim();


if(value===""){

msg.textContent=
"Write your feedback first";

return;

}


try{

msg.textContent=
"Sending...";


await addDoc(

collection(db,"feedback"),

{

studentEmail:currentEmail,

message:value,

reply:"",

time:serverTimestamp()

}

);


msg.textContent=
"Feedback Sent Successfully ✅";


box.value="";


await loadReplies();

}

catch(error){

console.error(
"FEEDBACK ERROR:",
error
);


msg.textContent=
"Could not send feedback";

}

}


document
.getElementById("feedbackBtn")
.addEventListener(
"click",
sendFeedback
);


document
.getElementById("logoutBtn")
.addEventListener(
"click",
async()=>{

try{

await signOut(auth);

window.location.href=
"student-login.html";

}

catch(error){

console.error(
"LOGOUT ERROR:",
error
);

}

}
);

async function loadVideos(){

let box=document.getElementById("videoList");

if(!box)return;

box.innerHTML="";


const snap=await getDocs(collection(db,"materials"));


snap.forEach((item)=>{

let data=item.data();


if(data.type==="video"){

box.innerHTML += `

<div class="lesson-card">

<b>${data.title}</b><br>

<a href="${data.link}" target="_blank">
▶ Watch Video
</a>

</div>

`;

}

});

}



async function loadPDFs(){

let box=document.getElementById("pdfList");

if(!box)return;


box.innerHTML="";


const snap=await getDocs(collection(db,"materials"));


snap.forEach((item)=>{

let data=item.data();


if(data.type==="pdf"){

box.innerHTML += `

<div class="lesson-card">

<b>${data.title}</b><br>

<a href="${data.link}" target="_blank">
📄 View PDF
</a>

</div>

`;

}

});

}




async function loadAnnouncements(){

let box=document.getElementById("announcementList");

if(!box)return;


box.innerHTML="";


const snap=await getDocs(collection(db,"materials"));


snap.forEach((item)=>{

let data=item.data();


if(data.type==="announcement"){

box.innerHTML += `

<div class="lesson-card">

${data.title}

</div>

`;

}

});

}



  
</script>

</body>
</html>
