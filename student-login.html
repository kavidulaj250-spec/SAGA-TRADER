<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SAGATRADING Student Login</title>



<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:#020617;

color:white;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}




.login-box{


background:#071426;

border:1px solid #00bfff;

border-radius:20px;

padding:40px;

width:350px;

text-align:center;


}




h2{

color:#00bfff;

font-size:30px;

margin-bottom:10px;

}




input{


width:100%;

padding:12px;

margin:10px 0;

border-radius:10px;

border:1px solid #00bfff;

background:#020617;

color:white;


}




button{


margin-top:15px;

padding:12px 35px;

background:#00bfff;

color:black;

border:none;

border-radius:30px;

font-weight:bold;

cursor:pointer;


}



button:hover{


background:white;


}




#message{


margin-top:20px;

color:#00ff88;


}



</style>


</head>



<body>




<div class="login-box">



<h2>
SAGATRADING
</h2>



<h3>
Student Login
</h3>




<input

id="email"

type="email"

placeholder="Student Email">





<input

id="password"

type="password"

placeholder="Password">





<button onclick="loginStudent()">

LOGIN

</button>




<p id="message"></p>




</div>

  <script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";



import {

getAuth,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



import {

getFirestore,

collection,

query,

where,

getDocs

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain: "sagatrading-mentorship.firebaseapp.com",

projectId: "sagatrading-mentorship",

storageBucket: "sagatrading-mentorship.firebasestorage.app",

messagingSenderId: "832507974614",

appId: "1:832507974614:web:6ad7b3f941d348a7388a77"

};





const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);








window.loginStudent = async function(){



let email = 
document.getElementById("email").value;



let password =
document.getElementById("password").value;





try{



await signInWithEmailAndPassword(auth,email,password);





const q = query(

collection(db,"students"),

where("email","==",email)

);





const snapshot = await getDocs(q);





if(snapshot.empty){


document.getElementById("message").innerHTML =

"Student record not found";


return;


}







let studentData;



snapshot.forEach((doc)=>{


studentData = doc.data();


});







if(studentData.status === "approved"){



document.getElementById("message").innerHTML =

"Login Successful";


setTimeout(()=>{


window.location.href="student-dashboard.html";


},1000);



}

else{



document.getElementById("message").innerHTML =

"Your account is waiting for admin approval";


}



}

.catch((error)=>{

console.log(error.code);

document.getElementById("message").innerHTML =
error.code;

});



}



</script>



</body>

</html>
