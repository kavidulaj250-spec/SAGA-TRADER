<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGATRADING Student Login</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#020617;
color:white;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}



.login-box{

background:#071426;

border:1px solid #00bfff;

border-radius:20px;

padding:40px;

width:350px;

text-align:center;

}



h2{

color:#00bfff;

font-size:30px;

}



h3{

margin-top:10px;

}



input{

width:100%;

padding:12px;

margin:10px 0;

border-radius:10px;

border:1px solid #00bfff;

background:#020617;

color:white;

}



button{

margin-top:15px;

padding:12px 35px;

background:#00bfff;

color:black;

border:none;

border-radius:30px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:white;

}



#message{

margin-top:20px;

color:#00ff88;

}


</style>


</head>


<body>



<div class="login-box">


<h2>
SAGATRADING
</h2>


<h3>
Student Login
</h3>



<input 
id="email"
type="email"
placeholder="Student Email">



<input 
id="password"
type="password"
placeholder="Password">



<button onclick="loginStudent()">

LOGIN

</button>



<p id="message"></p>


</div>

  <script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";



import {

getAuth,

signInWithEmailAndPassword,

setPersistence,

browserLocalPersistence

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



import {

getFirestore,

collection,

query,

where,

getDocs

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";





const firebaseConfig = {


apiKey:"AIzaD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain:"sagatrading-mentorship.firebaseapp.com",

projectId:"sagatrading-mentorship",

storageBucket:"sagatrading-mentorship.firebasestorage.app",

messagingSenderId:"832507974614",

appId:"1:832507974614:web:6ad7b3f941d348a7388a77"

};





const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);





// Save login session

await setPersistence(

auth,

browserLocalPersistence

);








window.loginStudent = async function(){



let email = document
.getElementById("email")
.value
.trim();



let password = document
.getElementById("password")
.value
.trim();



let message = document
.getElementById("message");






if(email==="" || password===""){


message.innerHTML="Enter Email and Password";


return;


}





message.innerHTML="Checking...";





try{



const result = await signInWithEmailAndPassword(

auth,

email,

password

);





console.log(

"LOGIN SUCCESS",

result.user.email

);







const q=query(

collection(db,"students"),

where("email","==",email)

);





const snapshot = await getDocs(q);






if(snapshot.empty){


message.innerHTML="Student record not found";


await auth.signOut();


return;


}






let studentData=null;





snapshot.forEach((doc)=>{


studentData=doc.data();


});







if(studentData.status!=="approved"){


message.innerHTML="Waiting For Admin Approval";


await auth.signOut();


return;


}







message.innerHTML="Login Successful ✅";





// wait for auth save

await new Promise(

resolve=>setTimeout(resolve,1500)

);






window.location.replace(

"student-dashboard.html"

);



}





catch(error){



console.log(error);



message.innerHTML=

"Login Failed : "+error.code;



}



}




</script>



</body>

</html>
