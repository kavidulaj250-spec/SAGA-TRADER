<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGATRADING Student Login</title>


<style>

body{

background:#020617;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.login-box{

background:#071426;
padding:40px;
border-radius:20px;
border:1px solid #00bfff;
width:350px;
text-align:center;

}


h2{

color:#00bfff;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #00bfff;
background:#020617;
color:white;

}


button{

padding:12px 30px;
background:#00bfff;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;

}


button:hover{

background:white;

}


</style>

</head>


<body>


<div class="login-box">


<h2>
SAGATRADING
</h2>


<h3>
Student Login
</h3>


<input 
id="email"
type="email"
placeholder="Email">


<input
id="password"
type="password"
placeholder="Password">


<button onclick="loginStudent()">

LOGIN

</button>


<p id="message"></p>


</div>





<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import { 

getAuth,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



const firebaseConfig = {


apiKey: "AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain: "sagatrading-mentorship.firebaseapp.com",

projectId: "sagatrading-mentorship",

storageBucket: "sagatrading-mentorship.firebasestorage.app",

messagingSenderId: "832507974614",

appId: "1:832507974614:web:6ad7b3f941d348a7388a77"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);





window.loginStudent = function(){


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



signInWithEmailAndPassword(auth,email,password)


.then(()=>{


window.location.href="student-dashboard.html";


})


.catch((error)=>{


document.getElementById("message").innerHTML =
"Login Failed";


});


}



</script>


</body>

</html>
