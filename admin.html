<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAGATRADING ADMIN PANEL</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#020617;
color:white;

}


.header{

background:#020611;
padding:30px;
text-align:center;
border-bottom:1px solid #00bfff;

}


.header h1{

color:#00bfff;

}



.container{

padding:40px 8%;

}



.card{

background:#071426;
border:1px solid #00bfff;
border-radius:20px;
padding:30px;
margin-bottom:30px;

}



h2{

color:#00bfff;
margin-bottom:20px;

}



input,select,textarea{

width:100%;
padding:12px;
margin:10px 0;

background:#020617;
color:white;

border:1px solid #00bfff;

border-radius:10px;

}



button{

padding:10px 20px;

border:none;

border-radius:20px;

cursor:pointer;

font-weight:bold;

}



.add{

background:#00bfff;
color:black;

}



.approve{

background:#00ff88;
color:black;

}



.reject{

background:red;
color:white;

}



.delete{

background:red;
color:white;

}



table{

width:100%;
border-collapse:collapse;

}


th,td{

padding:12px;
border:1px solid #00bfff;
text-align:center;

}


th{

color:#00ff88;

}



.link{

color:#00bfff;

}



</style>


</head>


<body>



<div class="header">

<h1>
SAGATRADING ADMIN PANEL
</h1>

<p>
Owner Control System
</p>


</div>






<div class="container">






<div class="card">


<h2>
👨‍🎓 Student Registrations
</h2>



<table id="studentTable">


<tr>

<th>Name</th>

<th>Email</th>

<th>Course</th>

<th>Status</th>

<th>Action</th>


</tr>


</table>


</div>








<div class="card">


<h2>
📚 Add Course Material
</h2>



<input 
id="title"
placeholder="Material Title">



<select id="type">


<option value="video">
Video
</option>


<option value="pdf">
PDF
</option>


<option value="announcement">
Announcement
</option>


</select>




<input

id="link"

placeholder="Video / PDF Link">





<textarea

id="description"

placeholder="Description">

</textarea>




<button class="add" onclick="addMaterial()">

ADD MATERIAL

</button>


</div>








<div class="card">


<h2>
📂 Uploaded Materials
</h2>



<table id="materialTable">


<tr>

<th>Title</th>

<th>Type</th>

<th>Action</th>


</tr>


</table>


</div>
<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";



import {

getFirestore,

collection,

getDocs,

addDoc,

doc,

updateDoc,

deleteDoc

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";






const firebaseConfig = {


apiKey:"AIzaSyD1vUF2PEwbcKsd1EhnxITRs_z_GZ689VQ",

authDomain:"sagatrading-mentorship.firebaseapp.com",

projectId:"sagatrading-mentorship",

storageBucket:"sagatrading-mentorship.firebasestorage.app",

messagingSenderId:"832507974614",

appId:"1:832507974614:web:6ad7b3f941d348a7388a77"


};






const app = initializeApp(firebaseConfig);


const db = getFirestore(app);








async function loadStudents(){



const snapshot = await getDocs(collection(db,"students"));



const table = document.getElementById("studentTable");



snapshot.forEach((student)=>{



let data = student.data();


let id = student.id;



let row = table.insertRow();



row.innerHTML = `


<td>${data.name || ""}</td>


<td>${data.email || ""}</td>


<td>${data.course || ""}</td>


<td>${data.status || "pending"}</td>



<td>


<button class="approve"

onclick="approveStudent('${id}')">

Approve

</button>



<button class="reject"

onclick="rejectStudent('${id}')">

Reject

</button>


</td>


`;



});



}









window.approveStudent = async function(id){


await updateDoc(

doc(db,"students",id),

{

status:"approved"

}

);



alert("Student Approved");


location.reload();


}








window.rejectStudent = async function(id){


await updateDoc(

doc(db,"students",id),

{

status:"rejected"

}

);



alert("Student Rejected");


location.reload();


}









window.addMaterial = async function(){



let title = document.getElementById("title").value;


let type = document.getElementById("type").value;


let link = document.getElementById("link").value;


let description = document.getElementById("description").value;





if(title===""){


alert("Enter Material Title");


return;


}






await addDoc(

collection(db,"materials"),

{


title:title,

type:type,

link:link,

description:description


}

);





alert("Material Added Successfully");



location.reload();



}









async function loadMaterials(){



const table = document.getElementById("materialTable");



const snapshot = await getDocs(

collection(db,"materials")

);





snapshot.forEach((item)=>{



let data = item.data();


let id = item.id;



let row = table.insertRow();





row.innerHTML = `


<td>

${data.title}

</td>



<td>

${data.type}

</td>




<td>


<button class="delete"

onclick="deleteMaterial('${id}')">

Delete

</button>


</td>


`;



});



}








window.deleteMaterial = async function(id){



await deleteDoc(

doc(db,"materials",id)

);



alert("Material Deleted");


location.reload();



}







loadStudents();


loadMaterials();



</script>



</body>

</html>
